<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>1:1 문의 - 막차유</title>
    <script>
        // ✨ 다른 화면 위 채팅 창(chat-launcher.js) 안에서 열릴 때: 헤더/하단 탭 숨김
        if (/[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add('embed');
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --primary: #ff2e63;
            --dark: #111827;
            --bg: #f3f4f6;
            --panel: #ffffff;
            --line: #e5e7eb;
            --muted: #64748b;
            --my: #ff2e63;
            --other: #ffffff;
            --tabbar-space: 104px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--dark);
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            padding-bottom: calc(var(--tabbar-space) + env(safe-area-inset-bottom, 0px));
            background: var(--bg);
        }
        .chat-shell {
            width: 100%;
            max-width: 520px;
            height: calc(100vh - var(--tabbar-space) - env(safe-area-inset-bottom, 0px));
            height: calc(100dvh - var(--tabbar-space) - env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            box-shadow: 0 14px 34px rgba(15,23,42,.08);
            overflow: hidden;
        }
        .chat-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            background: #ffffff;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 8px 22px rgba(15,23,42,.05);
        }
        .top-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .brand img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        .brand-title {
            font-size: 18px;
            font-weight: 1000;
            letter-spacing: -.4px;
            line-height: 1.15;
        }
        .brand-sub {
            margin-top: 3px;
            font-size: 11px;
            color: var(--muted);
            font-weight: 800;
        }
        .community-card {
            margin: 12px 14px 0;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 12px;
            border-radius: 6px;
            background: #fff5f8;
            border: 1px solid rgba(255,46,99,.18);
        }
        .community-title {
            font-size: 13px;
            font-weight: 1000;
        }
        .community-desc {
            margin-top: 3px;
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            font-weight: 700;
        }
        .community-link {
            min-height: 36px;
            padding: 0 12px;
            border-radius: 4px;
            background: #FEE500;
            color: #191600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 1000;
        }
        .chat-section {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 14px 18px;
            position: relative;
            background:
                linear-gradient(rgba(255,255,255,.88), rgba(255,255,255,.88)),
                url('ltu_simple_icon.png') center 44% / 210px auto no-repeat,
                #f8fafc;
        }
        .chat-section > * {
            position: relative;
            z-index: 1;
        }
        .system-card {
            margin: 0 0 14px;
            padding: 13px 14px;
            border-radius: 6px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.55;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bubble-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .bubble-row.mine { align-items: flex-end; }
        .bubble-row.other { align-items: flex-start; }
        .sender-name {
            margin: 0 6px 5px;
            color: #64748b;
            font-size: 11px;
            font-weight: 900;
        }
        .bubble {
            max-width: 82%;
            padding: 11px 14px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            box-shadow: 0 8px 20px rgba(0,0,0,.16);
            white-space: pre-wrap;
        }
        .mine .bubble {
            background: linear-gradient(135deg, var(--primary), #e91e63);
            color: #fff;
        }
        .other .bubble {
            background: #f8fafc;
            color: #172033;
            border: 1px solid #e5e7eb;
        }
        .time {
            margin: 5px 6px 0;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
        }
        .controls {
            flex: 0 0 auto;
            z-index: 20;
            padding: 12px 14px 22px;
            background: rgba(255,255,255,.94);
            border-top: 1px solid var(--line);
            backdrop-filter: blur(16px);
        }
        .quick-row {
            display: flex;
            gap: 7px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .quick-btn {
            flex: 0 0 auto;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            color: #334155;
            border-radius: 4px;
            min-height: 34px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }
        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 9px;
        }
        #msg {
            flex: 1;
            min-height: 46px;
            max-height: 120px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            background: #ffffff;
            color: #111827;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            resize: none;
            line-height: 1.45;
        }
        #msg::placeholder { color: #94a3b8; }
        .send-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--primary), #e91e63);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            font-weight: 1000;
            box-shadow: 0 10px 24px rgba(255,46,99,.26);
        }
        .empty {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 800;
            padding: 40px 0;
        }
        .tabbar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 5px calc(8px + env(safe-area-inset-bottom, 0px));
            background: #ffffff;
            border-top: 0.5px solid #e2e8f0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
        }
        .tabbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex: 1;
            padding: 6px 2px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: transparent;
            font-family: inherit;
        }
        .tabbar-item.active { color: #ec4899; }
        .tabbar-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            font-size: 22px;
            line-height: 1;
            position: relative;
        }
        .chat-unread-badge {
            display: none;
            position: absolute;
            top: -8px;
            right: -12px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: #ff2e63;
            color: white;
            border: 2px solid white;
            font-size: 10px;
            font-weight: 1000;
            line-height: 14px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(255,46,99,.28);
        }
        .tabbar-label {
            font-size: 10px;
            font-weight: 700;
        }
        .tabbar-item.active .tabbar-icon {
            transform: translateY(-2px);
            transition: transform 0.2s;
        }
        .tabbar-item.active .tabbar-label { font-weight: 900; }
        @media (max-width: 380px) {
            :root { --tabbar-space: 112px; }
            .tabbar { padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); }
            .tabbar-icon { font-size: 20px; }
            .tabbar-label { font-size: 9px; }
        }
        /* ✨ 뒤로가기 버튼 (아이폰은 하드웨어 뒤로가기가 없어서 화면에 버튼 제공) */
        .back-btn {
            flex: 0 0 auto;
            width: 36px;
            height: 36px;
            margin-left: -8px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--dark);
            font-family: inherit;
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:active { background: #f1f5f9; }
        /* ✨ 채팅 창(embed) 모드: 바깥 창이 헤더/뒤로가기를 제공하므로 내부 헤더·탭바 숨김 */
        html.embed { --tabbar-space: 0px; }
        html.embed .chat-header,
        html.embed .tabbar { display: none; }
        html.embed .chat-shell {
            max-width: none;
            border: none;
            box-shadow: none;
        }
        html.embed .community-card { margin-top: 10px; }
    </style>
<script src="app-update.js" defer></script></head>
<body>
    <main class="chat-shell">
        <header class="chat-header">
            <div class="top-row">
                <button class="back-btn" id="backBtn" type="button" aria-label="뒤로가기">‹</button>
                <div class="brand">
                    <img src="ltu_simple_icon.png" alt="LTU">
                    <div>
                        <div class="brand-title">1:1 문의</div>
                        <div class="brand-sub" id="memberInfo">회원 정보를 불러오는 중...</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="community-card">
            <div>
                <div class="community-title">커뮤니티 채팅</div>
                <div class="community-desc">팀원들과 자유롭게 이야기하는 카카오 오픈채팅입니다.</div>
            </div>
            <a class="community-link" href="https://open.kakao.com/o/gvrohEEh" target="_blank" rel="noopener">입장</a>

        <section class="chat-section" id="scrollBox">
            <div class="system-card">
                문의는 관리자에게 1:1로 전달됩니다. 경기, 회비, 상점, 계정 관련 내용을 남겨주세요.
            </div>
            <div class="history-list" id="historyList">

        <footer class="controls">

                <button class="quick-btn" type="button" data-text="경기 참여 관련 문의입니다.">경기문의</button>

                <button class="quick-btn" type="button" data-text="회비 관련 문의입니다.">회비문의</button>
                <button class="quick-btn" type="button" data-text="상점 주문 관련 문의입니다.">상점문의</button>
                <button class="quick-btn" type="button" data-text="계정 또는 프로필 관련 문의입니다.">계정문의</button>
                <button class="quick-btn" type="button" data-text="운영 관련 문의입니다.">운영문의</button>

            <div class="input-area">
                <textarea id="msg" placeholder="문의 내용을 입력하세요" rows="1"></textarea>

            </div>
        </footer>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo6x8MqKqEJVstH9ZjDa6tyrOPHEo6CfM",
            authDomain: "makcha-united-final.firebaseapp.com",
            databaseURL: "https://makcha-united-final-default-rtdb.firebaseio.com",
            projectId: "makcha-united-final",
            storageBucket: "makcha-united-final.firebasestorage.app",
            messagingSenderId: "631914143856",
            appId: "1:631914143856:web:5d96e048da9a19a90954b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const userKey = localStorage.getItem('userKey');
        const startTime = Date.now();
        const isEmbed = document.documentElement.classList.contains('embed');
        const msgInput = document.getElementById('msg');
        const historyList = document.getElementById('historyList');
        const scrollBox = document.getElementById('scrollBox');
        let me = null;
        let lastAlertedId = null;

        function setChatUnreadBadge(count) {
            document.querySelectorAll('[data-chat-unread-badge]').forEach(badge => {
                if (count > 0) {
                    badge.textContent = count > 9 ? '9+' : `+${count}`;
                    badge.style.display = 'inline-flex';
                    badge.style.alignItems = 'center';
                    badge.style.justifyContent = 'center';
                } else {
                    badge.textContent = '';
                    badge.style.display = 'none';
                }
            });
        }

        // ✨ 뒤로가기 버튼: 앱 안에서 넘어왔으면 이전 화면으로, 바로 열었으면 홈으로
        document.getElementById('backBtn').addEventListener('click', () => {
            const fromApp = document.referrer && document.referrer.indexOf(location.origin) === 0;
            if (fromApp && history.length > 1) history.back();
            else location.href = 'mypage.html';
        });

        // ✨ 관리자 답변 알림음 (외부 mp3 대신 브라우저에서 직접 생성 → 차단/403 걱정 없음)
        //    채팅 창(embed) 안에서는 바깥 화면(chat-launcher.js)이 대신 울림 (소리 권한이 바깥 화면에 있음)
        let alertCtx = null;
        function unlockAlertSound() {
            try {
                if (!alertCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) alertCtx = new AC();
                }
                if (alertCtx && alertCtx.state === 'suspended') alertCtx.resume();
            } catch (e) {}
        }
        ['pointerdown', 'touchend', 'keydown'].forEach(evt => document.addEventListener(evt, unlockAlertSound, { capture: true, passive: true }));
        function playAlertSound() {
            if (isEmbed) {
                try { parent.postMessage({ type: 'ltu-chat-alert' }, location.origin); } catch (e) {}
                return;
            }
            try {
                if (!alertCtx || alertCtx.state !== 'running') return;
                const t = alertCtx.currentTime;
                [[880, 0], [1320, 0.13]].forEach(([freq, delay]) => {
                    const osc = alertCtx.createOscillator();
                    const gain = alertCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, t + delay);
                    gain.gain.exponentialRampToValueAtTime(0.18, t + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.22);
                    osc.connect(gain).connect(alertCtx.destination);
                    osc.start(t + delay);
                    osc.stop(t + delay + 0.24);
                });
            } catch (e) {}
        }

        if (!userKey) {
            location.href = 'login.html';
            throw new Error('Login required');
        }

        const roomRef = ref(db, `soccer_club/inquiries/${userKey}`);
        const messagesRef = ref(db, `soccer_club/inquiries/${userKey}/messages`);

        function escapeHTML(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(timestamp) {
            return new Date(timestamp || Date.now()).toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                scrollBox.scrollTop = scrollBox.scrollHeight;
            });
        }

        async function loadMember() {
            const snap = await get(ref(db, `soccer_club/members/${userKey}`));
            me = snap.val() || {};
            document.getElementById('memberInfo').innerText = `${me.name || '회원'} · 관리자 문의방`;

            await update(roomRef, {
                userKey,
                userName: me.name || '회원',
                userPhone: me.phone || '',
                userId: me.userId || '',
                status: 'open',
                updatedAt: Date.now()
            });
        }

        async function sendMessage(text) {
            const message = String(text || '').trim();
            if (!message) return;

            const payload = {
                message,
                senderType: 'member',
                senderName: me?.name || '회원',
                userKey,
                timestamp: Date.now()
            };

            await push(messagesRef, payload);
            await update(roomRef, {
                userKey,
                userName: me?.name || '회원',
                userPhone: me?.phone || '',
                userId: me?.userId || '',
                lastMessage: message,
                lastSender: 'member',
                status: 'open',
                updatedAt: payload.timestamp,
                unreadAdmin: true
            });

            msgInput.value = '';
            msgInput.style.height = 'auto';
        }

        function renderMessagesFromRows(rows) {
            rows.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            if (rows.length === 0) {
                historyList.innerHTML = '<div class="empty">아직 문의 내역이 없습니다.</div>';
                return;
            }

            historyList.innerHTML = rows.map(data => {
                const isMine = data.senderType === 'member';
                const sender = isMine ? (me?.name || '나') : (data.senderName || '관리자');
                return `
                    <div class="bubble-row ${isMine ? 'mine' : 'other'}">
                        ${isMine ? '' : `<div class="sender-name">${escapeHTML(sender)}</div>`}
                        <div class="bubble">${escapeHTML(data.message)}</div>
                        <span class="time">${formatTime(data.timestamp)}</span>
                    </div>
                `;
            }).join('');

            const newest = rows[rows.length - 1];
            // 같은 답변으로는 한 번만 울림 (읽음 처리하면서 화면이 다시 그려져도 중복 알림 X)
            if (newest && newest.timestamp > startTime && newest.senderType === 'admin' && newest.id !== lastAlertedId) {
                lastAlertedId = newest.id;
                playAlertSound();
            }
            scrollToBottom();
        }

        function renderRoom(snapshot) {
            const room = snapshot.val() || {};
            const rows = Object.entries(room.messages || {}).map(([id, data]) => ({ id, ...data }));
            renderMessagesFromRows(rows.slice(-80));

            if (room.unreadMember || Number(room.memberUnreadCount || 0) > 0) {
                setChatUnreadBadge(0);
                update(roomRef, {
                    unreadMember: false,
                    memberUnreadCount: 0,
                    memberReadAt: Date.now()
                }).catch(() => {});
            }
        }

        document.getElementById('sendBtn').onclick = () => sendMessage(msgInput.value);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(msgInput.value);
            }
        });
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
        });
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                msgInput.value = btn.dataset.text || '';
                msgInput.focus();
                msgInput.dispatchEvent(new Event('input'));
            });
        });

        await loadMember();
        onValue(roomRef, renderRoom);
    </script>
</body>
</html>
