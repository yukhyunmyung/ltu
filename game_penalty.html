<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>승부차기 킹 - 막차유 ⚽</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .stars {
            position: fixed; inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 60% 50%, white, transparent),
                radial-gradient(1.5px 1.5px at 80% 20%, white, transparent),
                radial-gradient(1px 1px at 30% 80%, white, transparent),
                radial-gradient(2px 2px at 90% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 10%, white, transparent),
                radial-gradient(1px 1px at 15% 60%, white, transparent),
                radial-gradient(1.5px 1.5px at 75% 85%, white, transparent);
            background-size: 250px 250px;
            opacity: 0.4;
            pointer-events: none;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.55; } }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; position: relative; z-index: 1; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .back-btn {
            background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.85); padding: 8px 14px; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
        }
        .points-bar {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.15));
            border: 0.5px solid rgba(255,215,0,0.4); padding: 8px 16px; border-radius: 10px;
            color: #ffd700; font-weight: 800; font-size: 14px;
        }

        .title-row { text-align: center; margin-bottom: 14px; }
        .title-sub { color: #ffd700; font-size: 11px; font-weight: 800; letter-spacing: 4px; }
        .title-main { color: white; font-size: 26px; font-weight: 900; letter-spacing: 1px; margin-top: 2px; }

        .score-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
        .score-box {
            flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px;
            padding: 10px 14px; border: 0.5px solid rgba(255,255,255,0.1);
        }
        .score-box.gold { border-color: rgba(255,215,0,0.4); }
        .score-box.danger { border-color: rgba(255,107,107,0.4); }
        .score-box .label { color: #94a3b8; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
        .score-box .value { font-size: 20px; font-weight: 900; margin-top: 3px; }
        .score-box.gold .value { color: #ffd700; }
        .score-box.danger .value { color: #ff6b6b; }

        .status-msg {
            text-align: center; font-size: 14px; font-weight: 700;
            margin-bottom: 12px; min-height: 32px; color: rgba(255,255,255,0.85);
        }
        .status-msg.goal { color: #4ade80; font-size: 28px; font-weight: 900; text-shadow: 0 0 20px rgba(74,222,128,0.6); animation: bounce 0.5s; }
        .status-msg.blocked { color: #ff6b6b; font-size: 22px; font-weight: 900; animation: shake 0.4s; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .stadium {
            width: 100%; display: block; border-radius: 16px; overflow: hidden;
            background: linear-gradient(180deg, #0a0e27 0%, #1a3d1a 60%, #0d2a0d 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 15px;
        }

        /* 🧤 골키퍼 다이빙 애니메이션 (5방향) */
        #goalkeeper { transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 170px 200px; }
        #goalkeeper.idle { animation: idle-sway 2s ease-in-out infinite alternate; }
        @keyframes idle-sway {
            0% { transform: translateX(-4px); }
            100% { transform: translateX(4px); }
        }
        /* 좌측 다이빙 (낮게) */
        #goalkeeper.dive-left { animation: none; transform: translate(-70px, 15px) rotate(-25deg); }
        /* 우측 다이빙 (낮게) */
        #goalkeeper.dive-right { animation: none; transform: translate(70px, 15px) rotate(25deg); }
        /* 좌상단 다이빙 (높게 점프 + 좌측) */
        #goalkeeper.dive-top-left { animation: none; transform: translate(-65px, -25px) rotate(-30deg); }
        /* 우상단 다이빙 (높게 점프 + 우측) */
        #goalkeeper.dive-top-right { animation: none; transform: translate(65px, -25px) rotate(30deg); }
        /* 중앙 (제자리에서 손 위로) */
        #goalkeeper.dive-center { animation: none; transform: translateY(-15px) scale(1.08); }
        /* 좌절 (골 들어갔을 때) */
        #goalkeeper.upset { animation: upset-shake 0.6s; }
        @keyframes upset-shake {
            0% { transform: translateY(0); }
            30% { transform: translateY(8px) rotate(-3deg); }
            60% { transform: translateY(8px) rotate(3deg); }
            100% { transform: translateY(8px) rotate(0); }
        }

        /* ⚽ 공 슛 애니메이션 (5방향) */
        #ball-group { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        /* 골 들어갈 때: 골대 안쪽 5개 위치로 */
        #ball-group.shoot-top-left { transform: translate(-90px, -200px) scale(0.5) rotate(-540deg); }
        #ball-group.shoot-top-right { transform: translate(90px, -200px) scale(0.5) rotate(540deg); }
        #ball-group.shoot-left { transform: translate(-90px, -150px) scale(0.5) rotate(-720deg); }
        #ball-group.shoot-center { transform: translate(0, -150px) scale(0.5) rotate(540deg); }
        #ball-group.shoot-right { transform: translate(90px, -150px) scale(0.5) rotate(720deg); }
        /* 막혔을 때: 골키퍼에 맞고 튕김 */
        #ball-group.miss-left { transform: translate(-130px, -80px) scale(0.4) rotate(-360deg); }
        #ball-group.miss-right { transform: translate(130px, -80px) scale(0.4) rotate(360deg); }
        #ball-group.miss-up { transform: translate(0, -100px) scale(0.4) rotate(720deg); }

        #net { transform-origin: 170px 180px; transition: transform 0.3s; }
        #net.shake { animation: net-shake 0.7s ease-out; }
        @keyframes net-shake {
            0% { transform: scaleY(1); }
            25% { transform: scaleY(1.08) skewX(-2deg); }
            50% { transform: scaleY(0.95) skewX(2deg); }
            75% { transform: scaleY(1.04) skewX(-1deg); }
            100% { transform: scaleY(1); }
        }

        /* 슛 버튼 그리드 (골대 모양 배치) */
        .shoot-grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
        .shoot-grid-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .shoot-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 14px 8px; border-radius: 14px; cursor: pointer;
            transition: 0.2s; font-family: inherit; text-align: center;
        }
        .shoot-btn.corner {
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,107,53,0.05));
            border-color: rgba(255,215,0,0.3);
        }
        .shoot-btn.center {
            background: linear-gradient(135deg, rgba(74,222,128,0.08), rgba(52,211,153,0.05));
            border-color: rgba(74,222,128,0.3);
        }
        .shoot-btn:hover:not(:disabled) {
            background: rgba(255,215,0,0.18); border-color: rgba(255,215,0,0.5);
            transform: translateY(-2px);
        }
        .shoot-btn:active:not(:disabled) { transform: scale(0.95); }
        .shoot-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .shoot-btn .dir-arrow {
            font-size: 22px; font-weight: 900; color: #ffd700; line-height: 1; margin-bottom: 4px;
        }
        .shoot-btn.center .dir-arrow { color: #4ade80; }
        .shoot-btn .name {
            font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.85); letter-spacing: 0.5px;
        }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 100; justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
            border-radius: 24px; padding: 30px 25px; max-width: 400px; width: 100%;
            text-align: center; border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-emoji { font-size: 64px; margin-bottom: 10px; }
        .modal-title { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
        .modal-title.win { color: #ffd700; }
        .modal-title.lose { color: #ff6b6b; }
        .modal-msg { color: rgba(255,255,255,0.8); font-size: 14px; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
        .reward-display {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.1));
            border: 1px solid rgba(255,215,0,0.3); padding: 15px; border-radius: 14px;
            margin-bottom: 20px; color: #ffd700; font-weight: 900; font-size: 22px;
        }
        .modal-btn {
            background: #ffd700; color: #1a1f3a; border: none; padding: 14px;
            border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer;
            width: 100%; margin-top: 8px;
        }
        .modal-btn.secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }

        .round-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .dot { width: 32px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); transition: all 0.3s; }
        .dot.active { background: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.6); }
        .dot.failed { background: #ff6b6b; }
        /* 📱 작은 화면 */
        @media (max-width: 380px) {
            .container { padding: 12px; }
            .title-main { font-size: 22px; }
            .title-sub { font-size: 10px; letter-spacing: 3px; }
            .score-box { padding: 8px 10px; }
            .score-box .value { font-size: 17px; }
            .score-box .label { font-size: 9px; }
            .status-msg { font-size: 13px; }
            .shoot-btn { padding: 12px 6px; }
            .shoot-btn .dir-arrow { font-size: 18px; }
            .shoot-btn .name { font-size: 11px; }
            .shoot-grid-bottom { gap: 6px; }
            .modal-card { padding: 24px 20px; }
            .modal-emoji { font-size: 54px; }
            .modal-title { font-size: 22px; }
            .reward-display { font-size: 20px; padding: 14px; }
        }
    
        /* ============================================
           📱 하단 탭바 (모든 페이지 공통)
           ============================================ */
        body { padding-bottom: 80px !important; }
        .tabbar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            border-top: 0.5px solid #e2e8f0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
            z-index: 999;
        }
        .tabbar-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; padding: 6px 2px; text-decoration: none; cursor: pointer;
            color: #94a3b8; transition: 0.2s; border: none; background: transparent;
            font-family: inherit;
        }
        .tabbar-item.active { color: #ec4899; }
        .tabbar-icon { 
            font-size: 22px; 
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
        }
        .tabbar-item.active .tabbar-icon {
            transform: translateY(-2px);
            transition: transform 0.2s;
        }
        .tabbar-label { font-size: 10px; font-weight: 700; }
        .tabbar-item.active .tabbar-label { font-weight: 900; }
        @media (max-width: 380px) {
            .tabbar { padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); }
            .tabbar-icon { font-size: 20px; height: 22px; }
            .tabbar-label { font-size: 9px; }
        }
    </style>
<script src="app-update.js" defer></script><script type="module" src="chat-launcher.js"></script></head>

    let isShooting = false;
    let gameStarted = false;

    const goalkeeper = document.getElementById('goalkeeper');
    const ballGroup = document.getElementById('ball-group');
    const net = document.getElementById('net');
    const statusMsg = document.getElementById('statusMsg');

    async function initGame() {
        const snap = await get(ref(db, `soccer_club/members/${userKey}`));
        if (!snap.exists()) {
            alert("회원 정보를 찾을 수 없습니다.");
            location.href = "mypage.html";
            return;
        }
        me = snap.val();
        const currentPoints = me.points || 0;

        if (currentPoints < ENTRY_FEE) {
            alert(`포인트가 부족합니다.\n현재: ${currentPoints}P / 필요: ${ENTRY_FEE}P`);
            location.href = "game_main.html";
            return;
        }

        // 입장료 차감
        const newPoints = currentPoints - ENTRY_FEE;
        await update(ref(db, `soccer_club/members/${userKey}`), { points: newPoints });
        await push(ref(db, 'soccer_club/pointHistory'), {
            userKey: userKey,
            userName: me.name,
            amount: -ENTRY_FEE,
            reason: "승부차기 입장료",
            balance: newPoints,
            timestamp: Date.now()
        });
        me.points = newPoints;
        gameStarted = true;
        document.getElementById('myPoints').innerText = newPoints.toLocaleString();
    }
    initGame();

    onValue(ref(db, `soccer_club/members/${userKey}/points`), (snap) => {
        if (snap.exists() && gameStarted) {
            document.getElementById('myPoints').innerText = (snap.val() || 0).toLocaleString();
        }
    });

    function updateDots(success) {
        const dots = document.querySelectorAll('.dot');
        if (success) {
            dots[streak - 1].classList.add('active');
        } else {
            dots[streak].classList.add('failed');
        }
    }

    // ⚽ 5방향 슛: 골키퍼가 같은 방향이면 막힘, 다르면 골
    // 라운드가 올라갈수록 골키퍼가 똑똑해져서 사용자 슛 방향을 잘 예측
    function calculateGoalProbability(shootType, round) {
        // 라운드별 골키퍼 정확도 (사용자와 같은 방향 예측 확률)
        const gkAccuracy = { 1: 0.20, 2: 0.20, 3: 0.35, 4: 0.50, 5: 0.60 }[round] || 0.60;

        // 슛 위치별 기본 보정값 (구석은 막기 어려움)
        const positionBonus = {
            'top-left': 0.10,    // 좌상단 구석 (어려운 방향)
            'top-right': 0.10,   // 우상단 구석
            'left': 0.05,        // 좌측
            'center': -0.10,     // 중앙 (가장 막기 쉬움)
            'right': 0.05        // 우측
        }[shootType] || 0;

        // 최종 골 확률 = (1 - 골키퍼 정확도) + 위치 보정
        return Math.max(0.15, Math.min(0.85, (1 - gkAccuracy) + positionBonus));
    }

    // 골키퍼 다이빙 방향 결정 (확률 기반)
    function determineGKDive(shootType, round, isGoal) {
        // 막힌 경우: 골키퍼는 사용자가 찬 방향과 같은 방향으로 다이빙
        if (!isGoal) {
            return shootType; // 같은 방향 막음
        }
        // 골 들어간 경우: 골키퍼는 다른 방향으로 다이빙 (랜덤)
        const allDirections = ['top-left', 'top-right', 'left', 'center', 'right'];
        const wrongDirections = allDirections.filter(d => d !== shootType);
        return wrongDirections[Math.floor(Math.random() * wrongDirections.length)];
    }

    // 공 애니메이션 결정
    function determineBallAnimation(shootType, isGoal) {
        if (isGoal) {
            // 골 들어갈 때: 사용자가 찬 방향대로 날아감
            return `shoot-${shootType}`;
        } else {
            // 막혔을 때: 골키퍼에 맞고 튕김
            const missDirection = {
                'top-left': 'miss-up',
                'top-right': 'miss-up',
                'left': 'miss-left',
                'right': 'miss-right',
                'center': 'miss-up'
            }[shootType] || 'miss-up';
            return missDirection;
        }
    }

    window.shoot = (shootType) => {
        if (isShooting || !gameStarted) return;
        isShooting = true;

        document.querySelectorAll('.shoot-btn').forEach(b => b.disabled = true);

        const round = streak + 1;
        const goalProb = calculateGoalProbability(shootType, round);
        const isGoal = Math.random() < goalProb;

        // 골키퍼 다이빙 (방향에 맞는 클래스)
        goalkeeper.classList.remove('idle');
        const gkDirection = determineGKDive(shootType, round, isGoal);
        goalkeeper.classList.add(`dive-${gkDirection}`);

        // 공 애니메이션
        const ballAnim = determineBallAnimation(shootType, isGoal);
        ballGroup.classList.add(ballAnim);

        // 시도 메시지 (5방향 한글)
        const shootNames = {
            'top-left': '좌측 상단',
            'top-right': '우측 상단',
            'left': '좌측',
            'center': '중앙',
            'right': '우측'
        };
        statusMsg.innerText = `${shootNames[shootType]} 슛 시도! ⚽`;
        statusMsg.className = "status-msg";

        setTimeout(() => {
            if (isGoal) {
                streak++;
                document.getElementById('streakDisplay').innerText = streak;
                statusMsg.innerText = "GOAL!! ⚽";
                statusMsg.className = "status-msg goal";
                net.classList.add('shake');
                updateDots(true);

                // 보너스 포인트
                let bonus = 0;
                if (streak === 3) bonus = 100;
                else if (streak === 4) bonus = 300;

                if (bonus > 0) {
                    totalEarned += bonus;
                    grantPoints(bonus, `승부차기 ${streak}골 보너스`);
                }

                if (streak >= 5) {
                    setTimeout(() => endGame(true), 1300);
                } else {
                    setTimeout(() => resetForNextShot(), 1700);
                }
            } else {
                statusMsg.innerText = "막혔습니다!";
                statusMsg.className = "status-msg blocked";
                goalkeeper.classList.add('upset');
                updateDots(false);
                setTimeout(() => endGame(false), 1500);
            }
        }, 650);
    };

    function resetForNextShot() {
        // ✅ SVG 요소는 classList 사용 필수
        // 모든 슛/미스 클래스 제거
        const ballClasses = [
            'shoot-top-left','shoot-top-right','shoot-left','shoot-center','shoot-right',
            'miss-left','miss-right','miss-up'
        ];
        ballClasses.forEach(c => ballGroup.classList.remove(c));

        // 골키퍼 모든 다이빙/감정 클래스 제거 후 idle 상태로
        const gkClasses = [
            'dive-top-left','dive-top-right','dive-left','dive-center','dive-right',
            'upset','idle'
        ];
        gkClasses.forEach(c => goalkeeper.classList.remove(c));
        // 약간의 딜레이 후 idle 추가 (애니메이션 재시작용)
        setTimeout(() => goalkeeper.classList.add('idle'), 50);

        net.classList.remove('shake');

        const remaining = 5 - streak;
        statusMsg.innerText = `${remaining}골 더 넣으면 잭팟! 🎯`;
        statusMsg.className = "status-msg";
        document.querySelectorAll('.shoot-btn').forEach(b => b.disabled = false);
        isShooting = false;
    }

    async function grantPoints(amount, reason) {
        try {
            const snap = await get(ref(db, `soccer_club/members/${userKey}/points`));
            const cur = snap.val() || 0;
            const newPts = cur + amount;
            await update(ref(db, `soccer_club/members/${userKey}`), { points: newPts });
            await push(ref(db, 'soccer_club/pointHistory'), {
                userKey: userKey,
                userName: me.name,
                amount: amount,
                reason: reason,
                balance: newPts,
                timestamp: Date.now()
            });
        } catch (e) {
            console.error("포인트 지급 실패:", e);
        }
    }

    async function endGame(isWin) {
        const modal = document.getElementById('gameOverModal');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalTitle = document.getElementById('modalTitle');
        const modalMsg = document.getElementById('modalMsg');
        const rewardDisplay = document.getElementById('rewardDisplay');

        if (isWin) {
            const jackpot = 2000;
            await grantPoints(jackpot, "승부차기 5연속 잭팟!");
            totalEarned += jackpot;

            modalEmoji.innerText = "🏆";
            modalTitle.innerText = "JACKPOT!";
            modalTitle.className = "modal-title win";
            modalMsg.innerText = "5연속 골 성공! 🎉\n축하합니다!";
            rewardDisplay.innerText = `💎 총 +${totalEarned.toLocaleString()} P`;
        } else {
            modalEmoji.innerText = streak >= 4 ? "😭" : streak >= 2 ? "😣" : "🥲";
            modalTitle.innerText = streak >= 4 ? "SO CLOSE!" : "GAME OVER";
            modalTitle.className = "modal-title lose";
            
            let msg = `${streak}연속 골 달성!\n`;
            if (totalEarned > 0) msg += "보너스 포인트는 챙겼어요 💎";
            else msg += "다음엔 더 잘할 수 있어요 💪";
            modalMsg.innerText = msg;
            rewardDisplay.innerText = totalEarned > 0 ? `💎 +${totalEarned.toLocaleString()} P 획득` : "재도전 가능!";
        }

        modal.classList.add('show');
    }
</script>
