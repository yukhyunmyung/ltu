<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>막차유 슬롯머신 🎰</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .stars {
            position: fixed; inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 60% 50%, white, transparent),
                radial-gradient(1.5px 1.5px at 80% 20%, white, transparent),
                radial-gradient(1px 1px at 30% 80%, white, transparent),
                radial-gradient(2px 2px at 90% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 10%, white, transparent),
                radial-gradient(1px 1px at 15% 60%, white, transparent),
                radial-gradient(1.5px 1.5px at 75% 85%, white, transparent);
            background-size: 250px 250px;
            opacity: 0.4;
            pointer-events: none;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.55; } }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; position: relative; z-index: 1; }

        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .back-btn {
            background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.85); padding: 8px 14px; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
        }
        .points-bar {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.15));
            border: 0.5px solid rgba(255,215,0,0.4); padding: 8px 16px; border-radius: 10px;
            color: #ffd700; font-weight: 800; font-size: 14px;
        }

        /* 타이틀 */
        .title-row { text-align: center; margin-bottom: 16px; }
        .title-sub { color: #ffd700; font-size: 11px; font-weight: 800; letter-spacing: 4px; }
        .title-main { color: white; font-size: 26px; font-weight: 900; letter-spacing: 1px; margin-top: 2px; }

        /* 슬롯 머신 본체 */
        .slot-machine {
            background: linear-gradient(180deg, #1a1f3a 0%, #2d3561 100%);
            border: 2px solid #ffd700;
            border-radius: 22px;
            padding: 14px 12px;
            box-shadow: 0 0 30px rgba(255,215,0,0.15), inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            margin-bottom: 14px;
        }
        .jackpot-badge {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700, #ff6b35);
            padding: 5px 18px; border-radius: 20px; color: #1a1f3a;
            font-size: 12px; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(255,107,53,0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        /* 릴 컨테이너 */
        .reels-frame {
            background: #000;
            border-radius: 14px;
            padding: 14px 8px;
            margin-top: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .reels {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            position: relative;
        }
        .reel {
            background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2e 100%);
            border: 0.5px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            height: 90px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .reel.winning {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.6), inset 0 2px 6px rgba(0,0,0,0.6);
            animation: winGlow 0.5s ease-in-out infinite alternate;
        }
        @keyframes winGlow {
            from { box-shadow: 0 0 15px rgba(255,215,0,0.4), inset 0 2px 6px rgba(0,0,0,0.6); }
            to { box-shadow: 0 0 25px rgba(255,215,0,0.8), inset 0 2px 6px rgba(0,0,0,0.6); }
        }
        .reel-strip {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }
        .symbol {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            flex-shrink: 0;
        }

        /* 페이라인 */
        .payline {
            margin-top: 10px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .payline-line { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent); }
        .payline-text { color: #ffd700; font-size: 10px; font-weight: 800; letter-spacing: 2px; }

        /* 정보 박스 */
        .info-row {
            display: flex; justify-content: space-between;
            margin-top: 14px; padding: 0 6px;
        }
        .info-item { text-align: center; flex: 1; }
        .info-item .label {
            color: rgba(255,255,255,0.5); font-size: 9px; font-weight: 700; letter-spacing: 1px;
        }
        .info-item .val {
            font-size: 17px; font-weight: 900; margin-top: 2px;
        }
        .info-item.bet .val { color: #ff6b35; }
        .info-item.win .val { color: #4ade80; }
        .info-item.spin .val { color: #ffd700; }

        /* 페이테이블 */
        .paytable {
            background: rgba(255,255,255,0.04);
            border: 0.5px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 12px 10px;
            margin-bottom: 14px;
        }
        .paytable-title {
            color: rgba(255,255,255,0.6);
            font-size: 10px; font-weight: 800;
            text-align: center; margin-bottom: 8px; letter-spacing: 2px;
        }
        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .pay-item {
            text-align: center;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 8px 4px;
            border: 0.5px solid rgba(255,255,255,0.05);
        }
        .pay-item.jackpot {
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,107,53,0.1));
            border-color: rgba(255,215,0,0.3);
        }
        .pay-symbols { font-size: 16px; }
        .pay-reward { font-size: 11px; font-weight: 900; color: #4ade80; margin-top: 2px; }
        .pay-item.jackpot .pay-reward { color: #ffd700; font-size: 12px; }

        /* SPIN 버튼 */
        .spin-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff6b35 100%);
            border: none;
            color: #1a1f3a;
            padding: 18px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 17px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,107,53,0.4);
            transition: 0.2s;
            font-family: inherit;
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,107,53,0.5);
        }
        .spin-btn:active:not(:disabled) { transform: scale(0.97); }
        .spin-btn:disabled {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 결과 메시지 */
        .result-msg {
            text-align: center;
            margin: 12px 0;
            min-height: 28px;
            font-size: 16px;
            font-weight: 900;
            color: rgba(255,255,255,0.7);
            transition: 0.3s;
        }
        .result-msg.win {
            color: #4ade80;
            font-size: 22px;
            text-shadow: 0 0 20px rgba(74,222,128,0.6);
            animation: bounceIn 0.5s;
        }
        .result-msg.jackpot {
            color: #ffd700;
            font-size: 28px;
            text-shadow: 0 0 30px rgba(255,215,0,0.8);
            animation: jackpotPulse 0.6s infinite alternate;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes jackpotPulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* 잭팟 폭죽 효과 */
        .confetti {
            position: fixed; inset: 0; pointer-events: none; z-index: 999;
            display: none;
        }
        .confetti.show { display: block; }
        .confetti-piece {
            position: absolute;
            width: 10px; height: 10px;
            top: -10px;
            opacity: 0;
            animation: fall 2.5s ease-in forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
            border-radius: 24px; padding: 30px 25px; max-width: 400px; width: 100%;
            text-align: center; border: 1px solid rgba(255,215,0,0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-emoji { font-size: 72px; margin-bottom: 8px; }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; color: #ffd700; }
        .modal-msg { color: rgba(255,255,255,0.8); font-size: 14px; line-height: 1.6; margin-bottom: 18px; white-space: pre-line; }
        .reward-display {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.1));
            border: 1px solid rgba(255,215,0,0.4); padding: 18px;
            border-radius: 14px; margin-bottom: 20px;
            color: #ffd700; font-weight: 900; font-size: 26px;
        }
        .modal-btn {
            background: #ffd700; color: #1a1f3a; border: none; padding: 14px;
            border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer;
            width: 100%; margin-top: 8px; font-family: inherit;
        }
        .modal-btn.secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        /* 📱 작은 화면 */
        @media (max-width: 380px) {
            .container { padding: 12px; }
            .title-main { font-size: 22px; }
            .title-sub { font-size: 10px; letter-spacing: 3px; }
            .symbol { font-size: 38px; }
            .reel { height: 75px; }
            .symbol { height: 75px; }
            .jackpot-badge { font-size: 11px; padding: 4px 14px; }
            .info-item .val { font-size: 14px; }
            .info-item .label { font-size: 8px; }
            .pay-symbols { font-size: 14px; }
            .pay-reward { font-size: 10px; }
            .pay-item.jackpot .pay-reward { font-size: 11px; }
            .spin-btn { padding: 16px; font-size: 15px; letter-spacing: 1px; }
            .result-msg { font-size: 14px; }
            .result-msg.win { font-size: 18px; }
            .result-msg.jackpot { font-size: 22px; }
            .modal-emoji { font-size: 56px; }
            .modal-title { font-size: 22px; }
            .reward-display { font-size: 22px; padding: 14px; }
        }
    
        /* ============================================
           📱 하단 탭바 (모든 페이지 공통)
           ============================================ */
        body { padding-bottom: 80px !important; }
        .tabbar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            border-top: 0.5px solid #e2e8f0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
            z-index: 999;
        }
        .tabbar-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; padding: 6px 2px; text-decoration: none; cursor: pointer;
            color: #94a3b8; transition: 0.2s; border: none; background: transparent;
            font-family: inherit;
        }
        .tabbar-item.active { color: #ec4899; }
        .tabbar-icon { 
            font-size: 22px; 
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
        }
        .tabbar-item.active .tabbar-icon {
            transform: translateY(-2px);
            transition: transform 0.2s;
        }
        .tabbar-label { font-size: 10px; font-weight: 700; }
        .tabbar-item.active .tabbar-label { font-weight: 900; }
        @media (max-width: 380px) {
            .tabbar { padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); }
            .tabbar-icon { font-size: 20px; height: 22px; }
            .tabbar-label { font-size: 9px; }
        }
    </style>
<script src="app-update.js" defer></script><script type="module" src="chat-launcher.js"></script></head>
<body>

<div class="stars"></div>

<div class="container">
    <div class="top-bar">
        <a href="game_main.html" class="back-btn">← 챌린지 센터</a>
        <div class="points-bar">💎 <span id="myPoints">0</span> P</div>
    </div>

    <div class="title-row">
        <div class="title-sub">★ MAKCHA CASINO ★</div>
        <div class="title-main">SLOT MACHINE</div>
    </div>

    <!-- 슬롯 머신 -->
    <div class="slot-machine">
        <div class="jackpot-badge">JACKPOT 5,000P 💎</div>

        <div class="reels-frame">
            <div class="reels">
                <div class="reel" id="reel0">
                    <div class="reel-strip" id="strip0"></div>
                </div>
                <div class="reel" id="reel1">
                    <div class="reel-strip" id="strip1"></div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-strip" id="strip2"></div>
                </div>
            </div>

            <div class="payline">
                <div class="payline-line"></div>
                <span class="payline-text">PAY LINE</span>
                <div class="payline-line"></div>
            </div>
        </div>

        <div class="info-row">
            <div class="info-item bet">
                <div class="label">BET</div>
                <div class="val">100 P</div>
            </div>
            <div class="info-item win">
                <div class="label">LAST WIN</div>
                <div class="val" id="lastWin">0 P</div>
            </div>
            <div class="info-item spin">
                <div class="label">SPINS</div>
                <div class="val" id="spinCount">0</div>
            </div>
        </div>
    </div>

    <!-- 결과 메시지 -->
    <div class="result-msg" id="resultMsg">레버를 당겨 행운을 시험해보세요! 🍀</div>

    <!-- 페이테이블 -->
    <div class="paytable">
        <div class="paytable-title">★ PAYTABLE ★</div>
        <div class="paytable-grid">
            <div class="pay-item"><div class="pay-symbols">⚽⚽⚽</div><div class="pay-reward">+50 P</div></div>
            <div class="pay-item"><div class="pay-symbols">👟👟👟</div><div class="pay-reward">+100 P</div></div>
            <div class="pay-item"><div class="pay-symbols">🥅🥅🥅</div><div class="pay-reward">+200 P</div></div>
            <div class="pay-item"><div class="pay-symbols">🎯🎯🎯</div><div class="pay-reward">+400 P</div></div>
            <div class="pay-item"><div class="pay-symbols">🏆🏆🏆</div><div class="pay-reward">+1,000 P</div></div>
            <div class="pay-item jackpot"><div class="pay-symbols">💎💎💎</div><div class="pay-reward">+5,000 P</div></div>
        </div>
    </div>

    <!-- SPIN 버튼 -->
    <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 SPIN (100P)</button>
</div>

<!-- 잭팟 폭죽 효과 -->
<div class="confetti" id="confetti"></div>

<!-- 결과 모달 -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-card">
        <div class="modal-emoji" id="modalEmoji">🎰</div>
        <h2 class="modal-title" id="modalTitle">JACKPOT!</h2>
        <p class="modal-msg" id="modalMsg">축하합니다!</p>
        <div class="reward-display" id="rewardDisplay">+5,000 P</div>
        <button class="modal-btn" onclick="closeModal()">🎰 한 번 더 도전</button>
        <button class="modal-btn secondary" onclick="location.href='game_main.html'">← 챌린지 센터</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo6x8MqKqEJVstH9ZjDa6tyrOPHEo6CfM",
        authDomain: "makcha-united-final.firebaseapp.com",
        databaseURL: "https://makcha-united-final-default-rtdb.firebaseio.com",
        projectId: "makcha-united-final",
        storageBucket: "makcha-united-final.firebasestorage.app",
        messagingSenderId: "631914143856",
        appId: "1:631914143856:web:5d96e048da9a19a90954b5"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userKey = localStorage.getItem("userKey");
    if(!userKey) {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
    }

    const SPIN_COST = 100;

    // 심볼 정의 (확률 가중치)
    const SYMBOLS = [
        { emoji: "⚽", name: "축구공", weight: 30, reward: 50 },
        { emoji: "👟", name: "축구화", weight: 25, reward: 100 },
        { emoji: "🥅", name: "골대", weight: 20, reward: 200 },
        { emoji: "🎯", name: "타겟", weight: 15, reward: 400 },
        { emoji: "🏆", name: "트로피", weight: 8, reward: 1000 },
        { emoji: "💎", name: "다이아", weight: 2, reward: 5000 }
    ];

    let me = null;
    let isSpinning = false;
    let spinCount = 0;
    let totalEarned = 0;
    let totalSpent = 0;

    // 가중치 기반 랜덤 심볼 추출
    function getRandomSymbol() {
        const totalWeight = SYMBOLS.reduce((sum, s) => sum + s.weight, 0);
        let random = Math.random() * totalWeight;
        for (const symbol of SYMBOLS) {
            random -= symbol.weight;
            if (random < 0) return symbol;
        }
        return SYMBOLS[0];
    }

    // 릴 스트립 초기화 (긴 띠 만들기)
    function buildReelStrip(reelIndex, finalSymbol) {
        const strip = document.getElementById(`strip${reelIndex}`);
        strip.innerHTML = '';
        // 회전용 심볼 20개 + 최종 심볼
        const stripSymbols = [];
        for (let i = 0; i < 20; i++) {
            stripSymbols.push(getRandomSymbol());
        }
        stripSymbols.push(finalSymbol); // 마지막에 최종 심볼

        stripSymbols.forEach(s => {
            const div = document.createElement('div');
            div.className = 'symbol';
            div.textContent = s.emoji;
            strip.appendChild(div);
        });
    }

    // 게임 초기화
    async function initGame() {
        const snap = await get(ref(db, `soccer_club/members/${userKey}`));
        if (!snap.exists()) {
            alert("회원 정보를 찾을 수 없습니다.");
            location.href = "mypage.html";
            return;
        }
        me = snap.val();
        document.getElementById('myPoints').innerText = (me.points || 0).toLocaleString();

        // 초기 릴에 랜덤 심볼 표시
        for (let i = 0; i < 3; i++) {
            const strip = document.getElementById(`strip${i}`);
            strip.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'symbol';
            div.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)].emoji;
            strip.appendChild(div);
        }

        updateButton();
    }
    initGame();

    // 실시간 포인트 동기화
    onValue(ref(db, `soccer_club/members/${userKey}/points`), (snap) => {
        if (snap.exists() && me) {
            me.points = snap.val() || 0;
            document.getElementById('myPoints').innerText = me.points.toLocaleString();
            updateButton();
        }
    });

    function updateButton() {
        const btn = document.getElementById('spinBtn');
        if (!me || (me.points || 0) < SPIN_COST) {
            btn.disabled = true;
            btn.innerText = "포인트 부족 (100P 필요)";
        } else if (!isSpinning) {
            btn.disabled = false;
            btn.innerText = "🎰 SPIN (100P)";
        }
    }

    // 포인트 차감/지급
    async function changePoints(amount, reason) {
        try {
            const snap = await get(ref(db, `soccer_club/members/${userKey}/points`));
            const cur = snap.val() || 0;
            const newPts = cur + amount;
            await update(ref(db, `soccer_club/members/${userKey}`), { points: newPts });
            await push(ref(db, 'soccer_club/pointHistory'), {
                userKey: userKey,
                userName: me.name,
                amount: amount,
                reason: reason,
                balance: newPts,
                timestamp: Date.now()
            });
            return newPts;
        } catch (e) {
            console.error("포인트 변경 실패:", e);
            return null;
        }
    }

    // 폭죽 효과
    function showConfetti() {
        const confetti = document.getElementById('confetti');
        confetti.classList.add('show');
        confetti.innerHTML = '';
        const colors = ['#ffd700', '#ff6b35', '#4ade80', '#ec4899', '#8b5cf6'];
        for (let i = 0; i < 80; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDelay = (Math.random() * 0.5) + 's';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            confetti.appendChild(piece);
        }
        setTimeout(() => confetti.classList.remove('show'), 3000);
    }

    // 메인 SPIN 함수
    window.spin = async () => {
        if (isSpinning) return;
        if (!me || (me.points || 0) < SPIN_COST) {
            alert(`포인트가 부족합니다.\n현재: ${me?.points || 0}P / 필요: ${SPIN_COST}P`);
            return;
        }

        isSpinning = true;
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        btn.innerText = "🎰 SPINNING...";

        // 릴 winning 효과 제거
        document.querySelectorAll('.reel').forEach(r => r.classList.remove('winning'));

        // 결과 메시지 초기화
        const resultMsg = document.getElementById('resultMsg');
        resultMsg.innerText = "🎰 회전 중...";
        resultMsg.className = "result-msg";

        // 1. 입장료 차감
        const newBalance = await changePoints(-SPIN_COST, "슬롯머신 베팅");
        if (newBalance === null) {
            isSpinning = false;
            updateButton();
            return;
        }
        totalSpent += SPIN_COST;
        spinCount++;
        document.getElementById('spinCount').innerText = spinCount;

        // 2. 결과 결정
        const reels = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];

        // 3. 릴별로 스트립 만들고 회전 시작
        for (let i = 0; i < 3; i++) {
            buildReelStrip(i, reels[i]);
            const strip = document.getElementById(`strip${i}`);
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0)';
            // 강제 리플로우
            void strip.offsetHeight;
        }

        // 4. 각 릴이 차례로 멈춤 (좌→중→우)
        for (let i = 0; i < 3; i++) {
            const strip = document.getElementById(`strip${i}`);
            const reel = document.getElementById(`reel${i}`);
            const stopDelay = 800 + i * 600; // 0.8초 / 1.4초 / 2.0초
            setTimeout(() => {
                // 마지막 심볼이 정중앙에 오도록 (스트립의 마지막 = 20번째 인덱스, 90px씩)
                strip.style.transition = `transform ${stopDelay/1000 * 0.7}s cubic-bezier(0.32, 0.94, 0.6, 1)`;
                strip.style.transform = `translateY(-${20 * 90}px)`;
            }, 50);
        }

        // 5. 모든 릴이 멈춘 후 결과 처리
        setTimeout(() => handleResult(reels), 50 + 800 + 2 * 600 + 800);
    };

    function handleResult(reels) {
        const allMatch = reels[0].emoji === reels[1].emoji && reels[1].emoji === reels[2].emoji;

        if (allMatch) {
            // 당첨!
            const reward = reels[0].reward;
            const isJackpot = reels[0].emoji === "💎";

            // 릴에 winning 효과
            document.querySelectorAll('.reel').forEach(r => r.classList.add('winning'));

            // 보상 지급
            changePoints(reward, `슬롯머신 ${reels[0].name} 3매치`).then(() => {
                totalEarned += reward;
                document.getElementById('lastWin').innerText = reward.toLocaleString() + ' P';

                const resultMsg = document.getElementById('resultMsg');
                if (isJackpot) {
                    resultMsg.innerText = "🎉 JACKPOT!! 💎";
                    resultMsg.className = "result-msg jackpot";
                    showConfetti();
                    // 잭팟 모달
                    setTimeout(() => showJackpotModal(reward), 1500);
                } else {
                    resultMsg.innerText = `${reels[0].emoji} 3매치! +${reward.toLocaleString()}P`;
                    resultMsg.className = "result-msg win";
                    // 일반 당첨은 모달 없이 다시 SPIN 가능
                    setTimeout(() => {
                        isSpinning = false;
                        updateButton();
                    }, 1500);
                }
            });
        } else {
            // 꽝
            document.getElementById('lastWin').innerText = '0 P';
            const resultMsg = document.getElementById('resultMsg');
            resultMsg.innerText = "아쉽네요... 한 번 더? 🎯";
            resultMsg.className = "result-msg";
            setTimeout(() => {
                isSpinning = false;
                updateButton();
            }, 800);
        }
    }

    function showJackpotModal(reward) {
        document.getElementById('modalEmoji').innerText = "💎";
        document.getElementById('modalTitle').innerText = "💎 JACKPOT! 💎";
        document.getElementById('modalMsg').innerText =
            `다이아몬드 3매치 성공!\n축하합니다!\n\n총 ${spinCount}번의 도전 끝에 잭팟 당첨!`;
        document.getElementById('rewardDisplay').innerText = `💎 +${reward.toLocaleString()} P`;
        document.getElementById('resultModal').classList.add('show');
    }

    window.closeModal = () => {
        document.getElementById('resultModal').classList.remove('show');
        document.querySelectorAll('.reel').forEach(r => r.classList.remove('winning'));
        const resultMsg = document.getElementById('resultMsg');
        resultMsg.innerText = "레버를 당겨 행운을 시험해보세요! 🍀";
        resultMsg.className = "result-msg";
        isSpinning = false;
        updateButton();
    };
</script>
